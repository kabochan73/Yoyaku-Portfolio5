x-backend: &backend
  image: yoyaku-portfolio3-backend
  build:
    context: ./backend
    target: dev
  volumes:
    - ./backend:/var/www/html
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started

services:
  backend:
    <<: *backend
    ports:
      - "8000:8080"

  worker:
    <<: *backend
    command: ["php", "/var/www/html/artisan", "queue:work", "database", "--tries=3"]
    stop_signal: SIGTERM
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck-queue"]
      start_period: 10s

  scheduler:
    <<: *backend
    command: ["php", "/var/www/html/artisan", "schedule:work"]
    stop_signal: SIGTERM
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck-schedule"]
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: futsal_db
      POSTGRES_USER: futsal
      POSTGRES_PASSWORD: futsal
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U futsal -d futsal_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  postgres_data:
